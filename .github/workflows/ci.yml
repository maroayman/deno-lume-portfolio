name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs never waste minutes: only the latest per ref finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DENO_FROZEN_LOCKFILE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
      # Images first: check:content validates cover thumbnails, which only
      # exist after the GHCR pull (fresh clones need `deno task images:pull`).
      - uses: oras-project/setup-oras@v2
      - run: oras pull ghcr.io/maroayman/images@sha256:16280f56b9ad9767cc2a2c544262ac810c5e1e6bf4f56d9d55793116ffa76044 -o ./_images-tmp && mkdir -p src/public/images && cp -r ./_images-tmp/src/public/images/. src/public/images/ && rm -rf ./_images-tmp
      - run: |
          IMAGE_COUNT=$(find src/public/images -type f | wc -l)
          if [ "$IMAGE_COUNT" -eq 0 ]; then echo "error: oras pull restored 0 files" >&2; exit 1; fi
          echo "images: $IMAGE_COUNT files restored from GHCR"
      - run: deno task check
      - run: deno task check:lint
      - run: deno fmt --check src/ _config.ts scripts/
      - run: deno task check:content
      - run: deno task check:pins
      # NOTE: CI floats ORAS via setup-oras (latest) while Vercel pins
      # ORAS_VERSION in vercel-build.sh — accepted drift, check:pins
      # intentionally covers only the images digest + lume version.
      - run: deno task build:all
