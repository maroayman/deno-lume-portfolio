name: Outdated
# Dependency-watch: dependabot only covers github-actions, so jsr/jsdelivr
# pins (lume, std/yaml) never get update PRs. This fails loudly once a week
# when `deno outdated` finds newer versions — triage with `deno outdated`
# locally, then bump deliberately (lockfile updates via `deno task check`).
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  outdated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
      - run: deno outdated
