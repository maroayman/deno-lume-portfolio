name: Links
# Rot detector: link rot already broke 3 article images once. Weekly scan
# plus manual runs; failures notify without blocking PRs (separate workflow).
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # Site-root absolute links (/images/...) resolve only after a build,
          # and the Lume build already proves those exist — check external URLs.
          args: --no-progress --max-retries 2 --timeout 20 --exclude ^/ --exclude localhost src/blog/*.md src/*.vto src/_includes/**/*.vto README.md docs/*.md
